name: SYLVA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── 诚实性检查 ──
  honesty-audit:
    name: Honesty Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run verify_honest_repo.py
        run: |
          cd scripts
          python3 verify_honest_repo.py --ci
          echo "PASS: Honesty audit"

  # ── 核心 Lean 模块零 sorry ──
  sorry-audit:
    name: Core Sorry Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check zero sorry in core SYLVA modules
        run: |
          COUNT=$(grep -rn '^\s*sorry\b' sylva_formalization/SylvaFormalization/SYLVA_*.lean 2>/dev/null | grep -v "_v5_4" | grep -v "^.*--" | wc -l)
          echo "Core sorry count: $COUNT"
          if [ "$COUNT" -gt 0 ]; then
            echo "FAIL: Core SYLVA modules must have zero sorry"
            grep -rn '^\s*sorry\b' sylva_formalization/SylvaFormalization/SYLVA_*.lean | grep -v "_v5_4" | grep -v "^.*--"
            exit 1
          fi
          echo "PASS: Zero sorry in core modules"

  # ── Python 验证脚本 ──
  validation-scripts:
    name: Validation Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy matplotlib scipy sympy pandas duckdb openpyxl networkx scikit-learn pillow statsmodels mpmath
      - name: Run all registered validation scripts
        run: python framework/verify_run_all.py

  # ── 已核定 Lean 核心的真实构建（不是全库通过声明） ──
  lean-core-build:
    name: Lean Core Build (four audited targets)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build only the four locally audited targets
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: sylva_formalization/SylvaFormalization
          auto-config: false
          build: true
          use-mathlib-cache: true
          build-args: "SYLVA_CHSHCore SYLVA_CrossModuleTheorems PhysicalChemistry.ReactionNetwork SYLVA_Causality"

  # ── 连接律数据库 ──
  connection-laws:
    name: Connection Law Database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Count and audit connection laws
        run: |
          FILE="sylva_formalization/SylvaFormalization/SYLVA_ConnectionLaws.lean"
          if [ -f "$FILE" ]; then
            COUNT=$(grep -c 'domainA :=' "$FILE")
            echo "Connection laws: $COUNT"
            if [ "$COUNT" -lt 100 ]; then
              echo "WARN: Connection law count below 100"
            else
              echo "PASS: Connection law count >= 100"
            fi
          else
            echo "INFO: ConnectionLaws.lean not found — skipping"
          fi

  # ── 缺失文件检查 ──
  known-gaps:
    name: Known Gaps Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify framework/doc consistency
        run: |
          GAPS_FILE="framework/GAPS.md"
          echo "Checking $GAPS_FILE for unresolved gaps..."
          MISSING=$(grep -c '完全缺失' "$GAPS_FILE" 2>/dev/null || echo "0")
          echo "Unresolved gaps: $MISSING"
          # Informational only; do not disguise the report as a passing proof gate.
          echo "INFO: Gap report generated; known gaps remain non-blocking"

  proof-rate-dashboard:
    name: Proof Rate Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate proof rate dashboard
        run: python scripts/proof_rate_dashboard.py
      - name: Upload dashboard
        uses: actions/upload-artifact@v4
        with:
          name: proof-rate-dashboard
          path: framework/proof_rate_dashboard.md

  lineage-check:
    name: Paper-Lineage Orphan Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check paper-module lineage
        run: |
          python scripts/lineage_checker.py
          echo "INFO: Orphan report generated; execution errors fail this job"
