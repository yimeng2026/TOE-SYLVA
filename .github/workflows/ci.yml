name: SYLVA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 诚实性检查 ──
  honesty-audit:
    name: Honesty Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run verify_honest_repo.py
        run: |
          cd scripts
          python3 verify_honest_repo.py --ci
          echo "PASS: Honesty audit"

  # ── 核心 Lean 模块零 sorry ──
  sorry-audit:
    name: Core Sorry Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check zero sorry in core SYLVA modules
        run: |
          COUNT=$(grep -rn '^\s*sorry\b' sylva_formalization/SylvaFormalization/SYLVA_*.lean 2>/dev/null | grep -v "_v5_4" | grep -v "^.*--" | wc -l)
          echo "Core sorry count: $COUNT"
          if [ "$COUNT" -gt 0 ]; then
            echo "FAIL: Core SYLVA modules must have zero sorry"
            grep -rn '^\s*sorry\b' sylva_formalization/SylvaFormalization/SYLVA_*.lean | grep -v "_v5_4" | grep -v "^.*--"
            exit 1
          fi
          echo "PASS: Zero sorry in core modules"

  # ── Python 验证脚本 ──
  validation-scripts:
    name: Validation Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install numpy matplotlib scipy
      - name: Run paper-level validation scripts
        run: |
          cd papers
          FAIL=0
          for f in $(find . -name "verify_*.py" -not -name "*_fixed.py" 2>/dev/null | sort); do
            echo "--- $f ---"
            if PYTHONIOENCODING=utf-8 python3 "$f" 2>&1; then
              echo "  PASS"
            else
              echo "  FAIL ($f)"
              FAIL=$((FAIL + 1))
            fi
          done
          echo "---"
          if [ "$FAIL" -gt 0 ]; then
            echo "$FAIL script(s) failed"
            exit 1
          fi
          echo "PASS: All validation scripts ($(find . -name 'verify_*.py' -not -name '*_fixed.py' | wc -l) checked)"

  # ── 连接律数据库 ──
  connection-laws:
    name: Connection Law Database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Count and audit connection laws
        run: |
          FILE="sylva_formalization/SylvaFormalization/SYLVA_ConnectionLaws.lean"
          if [ -f "$FILE" ]; then
            COUNT=$(grep -c 'domainA :=' "$FILE")
            echo "Connection laws: $COUNT"
            if [ "$COUNT" -lt 100 ]; then
              echo "WARN: Connection law count below 100"
            else
              echo "PASS: Connection law count >= 100"
            fi
          else
            echo "INFO: ConnectionLaws.lean not found — skipping"
          fi

  # ── 缺失文件检查 ──
  known-gaps:
    name: Known Gaps Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify framework/doc consistency
        run: |
          GAPS_FILE="framework/GAPS.md"
          echo "Checking $GAPS_FILE for unresolved gaps..."
          MISSING=$(grep -c '完全缺失' "$GAPS_FILE" 2>/dev/null || echo "0")
          echo "Unresolved gaps: $MISSING"
          # This is informational — we don't fail on known gaps
          echo "PASS: Gap report current"

  proof-rate-dashboard:
    name: Proof Rate Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate proof rate dashboard
        run: python scripts/proof_rate_dashboard.py
      - name: Upload dashboard
        uses: actions/upload-artifact@v4
        with:
          name: proof-rate-dashboard
          path: framework/proof_rate_dashboard.md

  lineage-check:
    name: Paper-Lineage Orphan Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check paper-module lineage
        run: |
          python scripts/lineage_checker.py || true
          echo "Lineage check completed (orphan report generated)"
